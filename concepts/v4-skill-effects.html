<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Token Forces · 전체 이펙트</title>
<style>
:root{--ink:#232a3b;--paper:#f4eddf;--line:#cdc4b5;--accent:#37896a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:#fff7df;border-radius:6px;padding:7px 12px;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ef6b38;outline-offset:3px}button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}a{color:var(--accent)}main{max-width:1160px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:16px}h1{font-size:clamp(22px,4vw,32px);line-height:1.25;margin:4px 0}header small{letter-spacing:2px}header p{margin:8px 0 0;color:#636777;font-size:12px}.filters{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px}.library{max-height:690px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#eee5d6;padding:8px}.library button{display:block;width:100%;text-align:left;margin-bottom:5px;padding:8px 10px}.library small{display:block;font-size:10px;opacity:.72}.viewer{min-width:0;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#30483d}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff7df;padding:14px 18px;border-bottom:1px solid #ffffff25}.top h2{margin:0;font-size:19px}.top small{color:#cbd1c4}canvas{display:block;width:100%;max-height:470px;aspect-ratio:440/440;object-fit:contain;background:#30483d}.controls{background:#fff7df;padding:16px}.controls .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#timeline{flex:1;min-width:100px;accent-color:var(--accent)}output{font-variant-numeric:tabular-nums;min-width:46px}#desc{margin:12px 0;font-size:13px;min-height:42px}.meta{color:#777b84;font-size:11px}.foot{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:12px}.tag{color:#f5c400}#search{width:100%;margin-bottom:8px;border:1px solid var(--line);border-radius:5px;padding:8px;background:#fff7df;color:var(--ink)}@media(max-width:650px){main{padding:14px}.layout{grid-template-columns:1fr;gap:10px}.library{max-height:165px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.library button{margin:0;font-size:12px}.library small{font-size:9px}.viewer canvas{max-height:350px}.top{padding:10px 12px}.controls{padding:12px}.filters{gap:4px}.filters button{padding:6px 8px;font-size:12px}header{align-items:flex-start}header a{font-size:12px;white-space:nowrap}.foot{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main>
<header><div><small>PAPER TOKEN FORCES / EFFECTS</small><h1>작은 전장, 모든 기술</h1><p id="summary"></p></div><a href="../v4/index.html">게임 플레이 ↗</a></header>
<div class="filters" aria-label="분류"><button data-group="all" aria-pressed="true">전체 기술</button><button data-group="war">전사</button><button data-group="arc">궁수</button><button data-group="mag">마법사</button><button data-group="any">공용</button><button data-group="weapon">무기 공격</button><button data-group="proc">패시브 발동</button></div>
<div class="layout"><aside><input id="search" type="search" placeholder="기술 이름 검색" aria-label="기술 검색"><div class="library" id="library"></div></aside>
<section class="viewer"><div class="top"><div><h2 id="name"></h2><small id="identity"></small></div><span class="tag" id="rank">★</span></div><canvas id="stage" aria-label="선택한 기술의 전투 연출"></canvas>
<div class="controls"><div class="row"><button id="play">일시정지</button><button id="replay">다시 보기</button><input id="timeline" type="range" min="0" max="4" step="0.01" value="0" aria-label="재생 위치"><output id="time">0.00초</output></div><p id="desc"></p><div class="row" role="group" aria-label="별 등급"><button data-star="1" aria-pressed="true">★</button><button data-star="2">★★</button><button data-star="3">★★★</button><label><input type="checkbox" id="effects" checked> 연출</label><label><input type="checkbox" id="statuses" checked> 지속 상태</label></div><p class="meta">시간 막대를 움직여 예고·타격·상태를 확인하세요. 실제 전투 규칙이 결정한 대상에 연출을 표시합니다.</p></div></section></div>
<div class="foot"><span>굵은 잉크 · 종이 조각 · 발밑 도장</span><span>Space 재생/정지 · ← → 기술 이동</span></div></main>
<script src="../shared/engine.js"></script><script src="../game/data.js"></script><script src="../game/art.js"></script><script src="../v4/data4.js"></script><script src="../v4/projectiles4.js"></script><script src="../v4/battle4.js"></script><script src="../v4/vfx4.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),W=440,H=440,grid=AC.squareGrid(5,6,58,{ox:75,oy:48}),ctx=$('stage').getContext('2d');
const defs=[...V4.UNITS.flatMap(u=>u.ult?[u.ult]:[]),...V4.SKILLS,...V4.ITEMS.flatMap(i=>i.act?[i.act]:[])];
const entries=[...defs,...V4.ITEMS.map(d=>({id:'w_'+d.id,name:d.name,cls:'weapon',kind:'weapon',item:d,desc:d.desc})),...Object.keys(VFX4.profiles).filter(id=>id.startsWith('p_')).map(id=>({id,name:({cleave:'주변 베기',venomStack:'독 중첩',multiHit:'잔상 연타',hookRoot:'갈고리 속박',vampire:'흡혈',vampireStack:'흡혈 누적',bloodthirst:'피의 대검 흡혈',guardHeal:'방패 회복',longshot:'장거리 명중',venomBonus:'독 대상 추가 피해',burnCrit:'화상 치명',poisonHit:'독 명중',burnHit:'불꽃 명중',stormHit:'번개 갈래',multiShot:'추가 화살',ambush:'기습',healMace:'철퇴 회복',healer:'성서 회복',echo:'메아리',hourglass:'모래시계',lastStand:'불멸의 방패',deadeye:'용의 눈',spellBurn:'마법 화상',spellSlow:'마법 둔화',spellLeech:'마법 흡혈',abyss:'심연의 불꽃',doubleHit:'용병 연타',burnAdd:'용의 숨결 누적',hawkFocus:'사냥매 소환',focus:'연속 공격 집중',headshot:'매의 눈 치명',evasive:'그림자 회피',storm:'폭풍 연쇄'})[id.slice(2)]||id,cls:'proc',kind:'proc',desc:'실제로 발동한 순간의 작은 연출입니다.'}))];
$('summary').textContent=`고유기 ${V4.UNITS.filter(u=>u.ult).length} · 스킬 칩 ${V4.SKILLS.length} · 아이템 액티브 ${V4.ITEMS.filter(i=>i.act).length} · 무기 ${V4.ITEMS.length}`;
let selected=entries.find(d=>d.id==='u_bishop'),star=1,group='all',time=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,scene,last=performance.now();
const labels={ult:'유닛 고유기',skill:'스킬 칩',act:'아이템 액티브',weapon:'무기 기본 공격',proc:'패시브'};
function listing(){const q=$('search').value;const list=entries.filter(d=>(group==='all'?defs.includes(d):d.cls===group)&&(!q||d.name.includes(q)||d.id.includes(q)));$('library').replaceChildren(...list.map(d=>{const b=document.createElement('button');b.dataset.id=d.id;b.setAttribute('aria-pressed',String(d===selected));b.textContent=d.name;const s=document.createElement('small');s.textContent=`${labels[d.kind]||'기술'} · ${V4.CLS[d.cls]?.name||''}`;b.append(s);return b;}));}
function build(){let cb;const effects=VFX4.create(),events=[];const fx={play(){},burst(){},shake(){},death(){},skill(id,data){events.push({id,data,start:cb?.t||0});effects.emit(id,data);},proc(kind,data){effects.emit('p_'+kind,data);},attack(data){effects.emit('weapon',data);}};
const api=BT4.create({grid,PLAYER_ROW:3,COLS:5,ROWS:6,getR:()=>({relics:[],act:1,round:1,diff:'normal'}),random:AC.rng(31),fx});
const id=selected.id.startsWith('u_')?selected.id.slice(2):({war:'squire',arc:'archer',mag:'apprentice'})[selected.item?.cls||selected.cls]||'apprentice';
const ally=(id,c,r,item=null)=>api.makeAlly({kind:'unit',id,uid:c+'-'+r,star,skills:selected.id==='vampire'?[{id:'vampire',star}]:[],item,rot:0},grid.idx(c,r),{ttiers:{}});
const caster=ally(id,2,3,selected.item?{id:selected.item.id,star}:null),allies=[caster,ally('squire',1,4),ally('archer',3,4),ally('apprentice',0,4)];
const foes=[[2,2],[2,1],[1,2],[3,2],[1,1],[3,1]].map(([c,r],i)=>{const e=api.makeFoe({def:GD.MONSTERS[['goblin','bandit','skel'][i%3]],cell:grid.idx(c,r),scale:1,rot:0});e.hp=e.maxHp=100000;return e;});
const hooks=api.hooks();cb=new AC.Combat(grid,[...allies,...foes],{hooks,random:AC.rng(21)});for(const u of allies){u.chip=null;u.act=null;u.hp=u.maxHp*.5;}allies[1].hp=allies[1].maxHp*.2;allies[2].hp=allies[2].maxHp*.8;
const target=foes[0];if(selected.kind==='weapon'){if(caster.range<=1)fx.attack({source:{x:caster.px,y:caster.py},target:{x:target.px,y:target.py},weapon:SHOTS4.profile(caster),star});}
else if(selected.kind==='proc'){const pos=u=>({x:u.px,y:u.py});effects.emit(selected.id,{source:pos(caster),target:pos(target),points:[pos(target)],cells:[pos(target)],star,stacks:3,healPoints:[pos(allies[1])],summon:'hawk'});}
else if(selected.effect==='passive')hooks.onHit(target,50,caster,'atk',false,cb);
else {caster.skills=[{def:selected,star:selected.kind==='ult'?1:star,cells:BT4.expandCells(selected,star)}];hooks.onCast(caster,target,cb);}
scene={cb,effects,events,caster,target,hooks};time=0;}
function tick(dt){scene.cb.t+=dt;scene.hooks.onTick(scene.cb,dt);scene.effects.step(dt);time+=dt;}
function seek(t){build();for(let n=0;n<Math.floor(t*60);n++)tick(1/60);draw();}
function select(id){const d=entries.find(d=>d.id===id);if(!d)return;selected=d;$('name').textContent=d.name;$('identity').textContent=`${labels[d.kind]} · ${V4.CLS[d.cls]?.name||''}`;$('desc').textContent=d.desc||'';build();listing();draw();}
function draw(){const dpr=Math.min(2,devicePixelRatio||1);if($('stage').width!==W*dpr){$('stage').width=W*dpr;$('stage').height=H*dpr;}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#30483d';ctx.fillRect(0,0,W,H);
for(const p of grid.cells){ctx.fillStyle=p.r<3?'#536455':'#4a675b';ctx.strokeStyle='#243a32';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(p.x-27,p.y-27,54,54,5);ctx.fill();ctx.stroke();}
if($('effects').checked){VFX4.drawFields(ctx,scene.cb,grid);scene.effects.draw(ctx,'under');}
for(const u of scene.cb.units.filter(u=>!u.dead)){ART.drawToken(ctx,ART.token(u.artId,u.side,24,2,u.side?'':V4.CLS[u.cls]?.art||''),u.px,u.py,24,{rot:0});if(u.lo)ART.drawLoadout(ctx,u.px,u.py,24,u.lo);if($('statuses').checked)VFX4.drawStatus(ctx,u,time,24,{polymorph:scene.effects.hasForm(u.id)});}
if(selected.kind==='weapon'&&scene.caster.range>1){for(let i=0;i<3;i++){const t=(time*2+i*.33)%1,a=scene.caster,b=scene.target;SHOTS4.draw(ctx,{src:a,tgt:b,x:a.px+(b.px-a.px)*t,y:a.py+(b.py-a.py)*t},time);}}
if($('effects').checked)scene.effects.draw(ctx,'over');$('time').textContent=time.toFixed(2)+'초';$('timeline').value=time;$('play').textContent=paused?'재생':'일시정지';}
$('library').onclick=e=>{const b=e.target.closest('[data-id]');if(b)select(b.dataset.id);};document.querySelector('.filters').onclick=e=>{const b=e.target.closest('[data-group]');if(b){group=b.dataset.group;document.querySelectorAll('[data-group]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));listing();}};$('search').oninput=listing;
document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{star=+b.dataset.star;document.querySelectorAll('[data-star]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('rank').textContent='★'.repeat(star);seek(time);});
$('timeline').oninput=()=>{paused=true;seek(+$('timeline').value);};$('play').onclick=()=>{paused=!paused;draw();};$('replay').onclick=()=>{paused=false;seek(0);};$('effects').onchange=draw;$('statuses').onchange=draw;
document.addEventListener('keydown',e=>{if(['INPUT','BUTTON'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();paused=!paused;draw();}if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const i=entries.indexOf(selected);select(entries[(i+(e.key==='ArrowRight'?1:entries.length-1))%entries.length].id);}});
window.SkillStudy={ids:defs.map(d=>d.id),select,seek, pause(){paused=true;},get events(){return scene.events;}};
select(selected.id);function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){for(let n=0;n<Math.max(1,Math.round(dt*60));n++)tick(1/60);if(time>=4)build();}draw();requestAnimationFrame(loop);}requestAnimationFrame(loop);
})();
</script></body></html>
