<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보드 재질 · 전후 비교</title><link rel="icon" href="data:,">
<style>*{box-sizing:border-box}body{margin:0;background:#202824;color:#eae5da;font:15px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:22px}h1{font:27px Georgia,serif;margin:0 0 12px}p{line-height:1.7;color:#b7c0b6}a{display:inline-block;border-radius:6px;padding:11px 15px;background:#d5c3a0;color:#29342b;text-decoration:none;margin:0 8px 12px 0}.compare{position:relative;aspect-ratio:684/676;border-radius:9px;overflow:hidden;border:1px solid #64705f}.compare img{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.compare .after{clip-path:inset(0 0 0 var(--split,50%))}.divider{position:absolute;top:0;bottom:0;left:var(--split,50%);width:2px;background:#f4d898;pointer-events:none}label{display:block;margin:16px 0;color:#dbceaf}input{display:block;width:100%;margin-top:10px;accent-color:#c4a66b;min-height:32px}figure{margin:22px 0}figure img{display:block;width:100%;border-radius:9px}figcaption{margin-top:8px;line-height:1.6;color:#b7c0b6}.labels{display:flex;justify-content:space-between;margin:8px 0;color:#d4cab4}@media(max-width:420px){main{padding:14px}h1{font-size:23px}}</style>
</head><body><main><h1>보드 재질 · 전후 비교</h1><p>같은 시드로 전사·궁수·마법사를 구매한 실제 게임 화면입니다. 반복 석판과 작은 풍경 모형을 원목 프레임·무광 인쇄면·카드와 주사위로 바꿨습니다.</p><a href="v4-tabletop-studio.html">3D 확대 화면 조작</a><a href="../v4/index.html">게임 플레이</a>
<div class="labels"><span>이전 · 석판과 풍경 모형</span><span>현재 · 인쇄 보드와 탁상 소품</span></div><div class="compare" id="compare"><img src="../docs/board-ui-evidence/after/board-390x844.png" alt="이전 버전의 실제 게임 보드"><img class="after" src="../docs/tabletop-studio-evidence/local/ui/board-390x844.png" alt="현재 버전의 실제 게임 보드"><div class="divider"></div></div><label>비교 경계 이동<input id="split" type="range" min="0" max="100" value="50" aria-label="이전과 현재 화면의 비교 경계"></label>
<figure><img src="../docs/tabletop-studio-evidence/local/studio-corner-1040.png" alt="공통 보드와 딱지를 사용한 실제 3D 확대 화면"><figcaption>게임과 같은 원목 보드·인쇄면·동전 모델·반사 조명을 사용하는 확대 화면입니다.</figcaption></figure></main><script>document.getElementById('split').oninput=e=>document.getElementById('compare').style.setProperty('--split',e.target.value+'%');</script></body></html>
