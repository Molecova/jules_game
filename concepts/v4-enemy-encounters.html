<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>달라진 전장 · 카드 원정대</title><style>
:root{--paper:#f5f0e5;--ink:#263b32;--line:#d3d1bf;--green:#245643}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}main{max-width:1120px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px;align-items:center}a{color:inherit}header b{letter-spacing:2px;font-size:12px}.eyebrow{font-size:11px;letter-spacing:3px;color:#7b886b;margin:38px 0 12px}h1{font-size:clamp(30px,5vw,52px);letter-spacing:-2px;margin:0 0 14px}p{line-height:1.65;color:#687468}button,select{font:inherit;border:1px solid #b9c4b5;border-radius:7px;background:#fffdf7;color:var(--ink);padding:10px 14px;cursor:pointer}button.on,button.primary{background:var(--green);color:white;border-color:var(--green)}.tabs{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fcfaf3}.board{background:#e3e7d6;padding:18px;position:relative}.board canvas{width:100%;display:block}.boardhead{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;margin:2px 6px 10px}.detail{padding:26px}h2{font-size:24px;margin:8px 0 12px}.tag{font-size:11px;color:#826443;background:#eee6d6;padding:5px 9px;border-radius:20px;display:inline-block}.detail select{width:100%;margin:8px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hint{padding:12px;background:#eef0e3;border-left:3px solid #718e42;font-size:13px;line-height:1.6}.enemies{margin-top:18px}.enemy{display:flex;gap:12px;border-top:1px solid #e0dfd0;padding:12px 0}.enemy img{width:52px;height:52px}.enemy b{font-size:14px}.enemy small{display:block;font-size:11px;line-height:1.5;color:#768071;margin-top:4px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:46px 0 18px}.sectionhead h2{margin:0}.sectionhead p{font-size:12px;margin:0}.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.shot{padding:12px 14px;background:#fcfaf3;border:1px solid var(--line);border-radius:10px}.shot canvas{width:100%;height:68px;display:block}.shot b{font-size:13px}.shot small{color:#7a826f;float:right;font-size:11px}footer{font-size:12px;margin:28px 0;color:#6e7868}#status{font-size:12px;color:#6f7a66;min-height:18px}@media(max-width:700px){main{padding:18px}.stage{grid-template-columns:1fr}.detail{padding:18px}.shots{grid-template-columns:repeat(2,minmax(0,1fr))}.sectionhead{display:block}.sectionhead p{margin-top:8px}header a{font-size:12px}.board{padding:12px}}
</style></head><body><main><header><b>카드 원정대 / FIELD NOTES 02</b><a href="../v4/index.html">게임 플레이 ↗</a></header><div class="eyebrow">FIVE ACTS. DIFFERENT ENEMIES.</div><h1>매번 다른 적,<br>다시 짜는 원정대.</h1><p>새로운 적 20종과 달라진 전투 30개.<br>적의 예고를 읽고, 부대를 펼치고, 달라진 공격을 살펴보세요.</p><nav class="tabs" id="acts" aria-label="막 선택"></nav><section class="stage"><div class="board"><div class="boardhead"><span id="actName"></span><span>LIVE BATTLE</span></div><canvas id="field" width="440" height="480" aria-label="선택한 전투 실시간 미리보기"></canvas></div><div class="detail"><span class="tag" id="tag"></span><h2 id="encTitle"></h2><select id="encounter" aria-label="전투 선택"></select><div class="hint" id="hint"></div><div class="controls"><button id="play" class="primary">일시정지</button><button id="reset">다시 보기</button><button id="formation">배치: 분산</button><select id="speed" aria-label="재생 속도"><option value="0.5">0.5배속</option><option value="1" selected>1배속</option><option value="2">2배속</option></select></div><div id="status" aria-live="polite"></div><div class="enemies" id="enemies"></div></div></section><div class="sectionhead"><h2>같은 직업, 다른 한 발.</h2><p>궁수 9종 · 마법사 9종의 기본 공격과 명중 연출</p></div><section class="shots" id="shots"></section><footer>전투 전 적 딱지를 누르면 스킬과 대응법을 확인할 수 있습니다. 기본 공격의 위력과 속도는 그대로입니다.</footer></main>
<script src="../shared/engine.js"></script><script src="../game/data.js"></script><script src="../game/art.js"></script><script src="../v4/data4.js"></script><script src="../v4/enemies4.js"></script><script src="../v4/encounters4.js"></script><script src="../v4/enemy-combat4.js"></script><script src="../v4/enemy-art4.js"></script><script src="../v4/projectiles4.js"></script><script src="../v4/battle4.js"></script><script src="../v4/vfx4.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('field'),ctx=canvas.getContext('2d'),grid=AC.squareGrid(5,6,67,{ox:52,oy:38});let act=1,selected=ENCOUNTERS4.templates[0],cb,paused=false,spread=true,speed=1,vfx,api,last=0;
const shotCards=[];
for(const d of V4.UNITS.filter(d=>d.cls!=='war')){const p=SHOTS4.profiles[d.id],el=document.createElement('article');el.className='shot';el.innerHTML=`<b>${d.name}</b><small>${p.name}</small><canvas width="320" height="80" aria-label="${d.name} 기본 공격"></canvas>`;$('shots').append(el);shotCards.push({d,ctx:el.querySelector('canvas').getContext('2d')});}
function chooseAct(n){act=n;const list=ENCOUNTERS4.templates.filter(t=>t.act===act);$('acts').innerHTML=GD.ACTS.slice(1,6).map((a,i)=>`<button class="${i+1===act?'on':''}" data-act="${i+1}">${i+1}막 ${a.name}</button>`).join('');$('encounter').innerHTML=list.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');selected=list[0];reset();}
function reset(){vfx=VFX4.create({cellSize:67});const r={act,round:(act-1)*6+3,relics:[],diff:'normal'};api=BT4.create({grid,COLS:5,ROWS:6,PLAYER_ROW:3,getR:()=>r,fx:{play(){},shake(){},burst(){},death(){},skill:(id,data)=>vfx.emit(id,data)}});
const party=['shieldman','squire','archer','apprentice','acolyte'],positions=spread?[[0,3],[4,3],[0,5],[4,5],[2,5]]:[[1,3],[2,3],[1,4],[2,4],[2,5]];
const allies=party.map((id,i)=>api.makeAlly({id,uid:'p'+i,star:Math.min(3,1+Math.floor((act-1)/2)),skills:[],item:null},grid.idx(...positions[i]),{ttiers:{}}));
const foes=[selected.core,selected.wing,selected.filler].map((id,i)=>api.makeFoe({uid:'e'+i,def:GD.MONSTERS[id],cell:grid.idx([2,0,4][i],GD.MONSTERS[id].range>1?0:2),scale:1}));
cb=new AC.Combat(grid,[...allies,...foes],{hooks:api.hooks(),maxTime:60});paused=false;$('play').textContent='일시정지';$('encTitle').textContent=selected.name;$('actName').textContent=act+'막 · '+GD.ACTS[act].name;$('tag').textContent=selected.tag;$('hint').textContent=selected.hint;$('formation').textContent='배치: '+(spread?'분산':'밀집');
$('enemies').innerHTML=foes.map(u=>{const d=u.def,a=ENEMIES4.abilities[d.enemyAbility];return `<div class="enemy"><img src="${ART.discURL(d.id,1,'',null,100)}" alt=""><div><b>${d.name}</b><small>${a?a.name+' · '+a.desc:d.desc}</small></div></div>`;}).join('');}
function draw(){ctx.clearRect(0,0,440,480);for(const q of grid.cells){ctx.fillStyle=q.r<3?'#dccdbc':'#cddbbf';ctx.fillRect(q.x-31,q.y-31,62,62);ctx.strokeStyle='#b8bba7';ctx.strokeRect(q.x-31,q.y-31,62,62);}ctx.strokeStyle='#a57363';ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(52,239);ctx.lineTo(387,239);ctx.stroke();ctx.setLineDash([]);
ENEMYCOMBAT4.draw(ctx,cb,grid,'under');for(const t of cb.tele||[])for(const i of t.cells){const q=grid.cells[i];ctx.fillStyle='#e9836055';ctx.fillRect(q.x-29,q.y-29,58,58);}vfx.draw(ctx,'under');
for(const u of cb.units.filter(u=>!u.dead).sort((a,b)=>a.py-b.py)){ART.drawToken(ctx,ART.token(u.artId,u.side,23,2),u.px,u.py,23,{flash:u.flash});ctx.fillStyle='#344139';ctx.fillRect(u.px-24,u.py+27,48,5);ctx.fillStyle=u.side?'#c56450':'#4a926d';ctx.fillRect(u.px-24,u.py+27,48*Math.max(0,u.hp/u.maxHp),5);}
for(const p of cb.projectiles)SHOTS4.draw(ctx,p,cb.t);SHOTS4.drawImpacts(ctx,cb);vfx.draw(ctx,'over');ENEMYCOMBAT4.draw(ctx,cb,grid,'over');
for(const f of cb.fx){ctx.globalAlpha=Math.max(0,1-f.t/f.life);if(f.kind==='beam'){ctx.strokeStyle=f.color||'#9b81b9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke();}if(f.kind==='ring'){ctx.strokeStyle=f.color;ctx.beginPath();ctx.arc(f.x,f.y,(f.r||20)*(f.t/f.life),0,7);ctx.stroke();}}ctx.globalAlpha=1;
for(const f of cb.floaters){ctx.font=(f.big?'bold 13px':'11px')+' sans-serif';ctx.textAlign='center';ctx.fillStyle='#fffdf5';ctx.strokeStyle='#26382e';ctx.lineWidth=3;ctx.strokeText(f.text,f.x,f.y);ctx.fillText(f.text,f.x,f.y);}
$('status').textContent=cb.done?(cb.winner===0?'원정대 승리':'전투 종료')+' · 배치를 바꿔 다시 비교해 보세요.':cb.t.toFixed(1)+'초 · 빨간 진영이 적입니다.';}
function shots(time){for(const {d,ctx:c}of shotCards){c.clearRect(0,0,320,80);ART.drawToken(c,ART.token(d.id,0,22,2),29,42,22,{});const phase=(time%1.65)/1.65,p={src:{artId:d.id,cls:d.cls,range:3},x:68+phase*218,y:42,tgt:{px:294,py:42}};c.strokeStyle='#dadccb';c.setLineDash([3,5]);c.beginPath();c.moveTo(67,42);c.lineTo(299,42);c.stroke();c.setLineDash([]);if(phase<.88)SHOTS4.draw(c,p,time);else SHOTS4.drawImpacts(c,{fx:[{kind:'unitImpact',x:275,y:42,profile:SHOTS4.profiles[d.id],t:(phase-.88)*2.5,life:.32}]});}}
let clock=0;function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(!paused){clock+=dt;let left=dt*speed;while(left>0&&!cb.done){const step=Math.min(1/60,left);cb.step(step);vfx.step(step);left-=step;}}draw();shots(clock);requestAnimationFrame(frame);}
$('acts').onclick=e=>{const b=e.target.closest('[data-act]');if(b)chooseAct(+b.dataset.act);};$('encounter').onchange=e=>{selected=ENCOUNTERS4.templates.find(t=>t.id===e.target.value);reset();};$('reset').onclick=reset;$('play').onclick=()=>{paused=!paused;$('play').textContent=paused?'재생':'일시정지';};$('formation').onclick=()=>{spread=!spread;reset();};$('speed').onchange=e=>speed=+e.target.value;
chooseAct(1);requestAnimationFrame(frame);window.EnemyStudy={select(id){const t=ENCOUNTERS4.templates.find(t=>t.id===id);chooseAct(t.act);selected=t;$('encounter').value=id;reset();},get combat(){return cb;},pause(){paused=true;$('play').textContent='재생';},step(seconds){for(let i=0;i<seconds*60&&!cb.done;i++){cb.step(1/60);vfx.step(1/60);}draw();},draw,shots(time){clock=time;shots(time);}};})();
</script></body></html>
