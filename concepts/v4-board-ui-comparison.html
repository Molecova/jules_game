<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보드·UI 개선 전후</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23c7ae74' d='M2 2h20v20H2z'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;background:#192b25;color:#eee3c9;font:14px/1.6 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:22px}h1{font:600 26px Georgia,serif;margin:0 0 8px}p{color:#c9c4ae;margin:0 0 14px}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:12px 0}select,a{background:#e7d6b2;color:#2a352c;padding:9px 12px;border:1px solid #c8a96d;border-radius:5px;font:inherit;text-decoration:none}label{display:flex;align-items:center;gap:10px}input{accent-color:#d8b876;width:160px}.compare{position:relative;width:min(390px,100%);margin:20px auto;box-shadow:0 16px 35px #0006;border:1px solid #b89b65}.compare.board{width:min(700px,100%)}img{display:block;width:100%;height:auto}.after{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--split,50%)) 0 0)}.divider{position:absolute;top:0;bottom:0;left:var(--split,50%);width:2px;background:#fff2c9;pointer-events:none}.badge{position:absolute;top:8px;padding:3px 9px;background:#15251ee8;border:1px solid #b89963;border-radius:4px;font-size:12px}.new{left:8px}.old{right:8px}.note{font-size:12px;text-align:center}@media(max-width:420px){main{padding:14px}input{width:120px}}
</style></head><body><main>
<h1>보드와 UI · 개선 전후</h1><p>같은 시드와 실제 상점 구매로 촬영한 게임 화면입니다. 슬라이더를 움직여 재질·보드 장식·배경·패널의 차이를 확인하세요.</p>
<div class="tools"><select id="screen" aria-label="비교할 화면"><option value="prep">전투 준비</option><option value="board">보드 확대</option><option value="title">타이틀</option><option value="map">원정 지도</option><option value="difficulty">원정 선택</option><option value="card-detail">상점 상세</option><option value="unit-detail">딱지 상세</option></select><label>비교 <input id="split" type="range" min="0" max="100" value="50" aria-label="개선 화면 표시 비율"></label><a href="../v4/index.html">게임 플레이</a></div>
<div class="compare" id="compare"><img id="before" alt="개선 전 실제 게임 화면"><img id="after" class="after" alt="개선 후 실제 게임 화면"><div class="divider"></div><span class="badge new">개선 후</span><span class="badge old">개선 전</span></div><p class="note">390×844 화면 캡처 · 게임 규칙과 수치는 유지</p>
</main><script>
const screen=document.getElementById('screen'),split=document.getElementById('split'),box=document.getElementById('compare');
function render(){box.classList.toggle('board',screen.value==='board');for(const side of ['before','after'])document.getElementById(side).src='../docs/board-ui-evidence/'+side+'/'+screen.value+'-390x844.png';}
screen.onchange=render;split.oninput=()=>box.style.setProperty('--split',split.value+'%');render();
</script></body></html>
